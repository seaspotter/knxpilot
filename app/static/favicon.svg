<svg width="256" height="256" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AC143"/>
      <stop offset="100%" stop-color="#2F5B1F"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#badgeGrad)"/>

  <!-- Bus line -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Device drop stubs -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="18" y1="32" x2="18" y2="21"/>
    <line x1="32" y1="32" x2="32" y2="43"/>
    <line x1="46" y1="32" x2="46" y2="21"/>
  </g>

  <!-- Devices -->
  <rect x="12.5" y="12.5" width="11" height="11" rx="3" fill="#ffffff"/>
  <rect x="26.5" y="43.5" width="11" height="11" rx="3" fill="#ffffff"/>
  <rect x="40.5" y="12.5" width="11" height="11" rx="3" fill="#ffffff"/>

  <!-- Bus end nodes -->
  <circle cx="10" cy="32" r="2.6" fill="#ffffff"/>
  <circle cx="54" cy="32" r="2.6" fill="#ffffff"/>
</svg>
