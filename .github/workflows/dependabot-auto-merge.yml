name: Dependabot auto-merge

# Auto-merges Dependabot PRs that are low-risk: GitHub Actions bumps and
# pip patch-level bumps, EXCEPT fastapi - its own changelog has repeatedly
# shipped "Breaking Changes" entries in non-major releases (e.g. the
# **extra kwarg removal, the parameter-model extra= propagation change,
# the boolean form-field default handling), so a bump that Dependabot
# classifies as a harmless patch can still change behavior. The Docker
# base image is never auto-merged either - a new Python minor version
# needs the pinned packages re-checked by hand (see DEVELOPMENT.md), and
# pr-build-check.yml only proves the image builds, not that it's the
# right call. Everything excluded here still needs a human to merge.
#
# Relies on branch protection requiring the "pytest"/"build" checks
# (tests.yml/pr-build-check.yml) on main - auto-merge only actually waits
# for those if they're configured as required, otherwise it would merge
# as soon as mergeable, checks or not.

on: pull_request

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for low-risk updates
        if: >
          steps.metadata.outputs.package-ecosystem == 'github_actions' ||
          (steps.metadata.outputs.package-ecosystem == 'pip' &&
           steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
           !contains(steps.metadata.outputs.dependency-names, 'fastapi'))
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
