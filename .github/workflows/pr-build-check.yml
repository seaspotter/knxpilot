name: PR build check

# Builds the Docker image on every pull request (amd64 only, never pushed)
# - a sanity check that the image still builds at all before a change lands
# on main, not just that pytest passes. This is the exact check we've been
# doing by hand for every Dockerfile base-image bump (install
# requirements.txt into a venv built with the real target Python version,
# boot a real server) - automating the "does it even build" half of that;
# still worth doing the fuller manual check too for a Python minor-version
# bump (see DEVELOPMENT.md). amd64-only and no multi-arch/QEMU/registry
# steps, unlike docker-publish.yml - this only needs to prove the build
# succeeds, not produce a publishable artifact.

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
