name: Publish Docker image

# Builds the image from the Dockerfile and pushes it to GitHub Container
# Registry, so a deployment can just `docker compose pull` instead of
# building locally (see DEPLOYMENT.md). Runs on every push to main (keeps
# the `latest` tag in step with what the in-app self-update mechanism
# pulls via git), on every push to dev (the `dev` tag, for a server that
# tracks the dev branch - see DEPLOYMENT.md) and on version tags (pins a
# specific release).

on:
  push:
    branches: [main, dev]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history/tags, not the default shallow clone - needed for
          # `git describe` below to find the right tag.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=tag
            type=sha,prefix=,format=short,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
