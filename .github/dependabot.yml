# Dependabot version updates: a weekly check that opens pull requests
# against main (the only branch, see DEVELOPMENT.md) when a newer version
# exists. The Tests and PR build-check workflows run on each PR, and
# low-risk ones auto-merge (see dependabot-auto-merge.yml). Updates are
# grouped per ecosystem, so it's a handful of PRs a week at most rather
# than one per package.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  # The Dockerfile's python:X.Y-slim base image. A new Python minor version
  # also needs the pinned packages to support it - pr-build-check.yml builds
  # the image on the PR itself, but check it locally too before merging
  # (never auto-merged, see dependabot-auto-merge.yml).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
