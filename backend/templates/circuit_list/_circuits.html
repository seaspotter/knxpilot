{# Every circuit (physical output), grouped floor -> room, with its
   channel-assignment select. Content of #circuits-section (see tab.html).
   Each row is independently swappable (see _circuit_row.html) - this whole
   section is only re-rendered on actor-instance changes (new/changed
   actuators mean new <option>s) or the bulk "Alle automatisch zuordnen"
   action, not on a single select change. #}
<div class="row" style="justify-content:space-between;">
  <span class="muted" id="circuits-summary">{{ assigned_count }} / {{ total_count }} Abgänge zugeordnet</span>
  <div class="row" style="margin:0;">
    <button class="btn secondary" onclick="autoAssignCircuits()">Alle automatisch zuordnen</button>
    <span class="info-icon" tabindex="0" data-tip="Weist jeden noch nicht zugeordneten Abgang dem ersten freien passenden Kanal zu. Mischt dabei nie Geschosse - ein Abgang im EG wird nur einem Aktor im EG zugeordnet, auch wenn dessen Kanäle voll sind. Aktoren ohne zugewiesenes Geschoss werden ebenfalls nicht verwendet.">i</span>
    <button class="btn secondary" onclick="downloadCircuitListCsv()">CSV herunterladen</button>
    <button class="btn" onclick="downloadCircuitListPdf()">PDF herunterladen</button>
  </div>
</div>
<div id="circuits-list">
  {% for f in floors %}
    <div class="floor-card">
      <div class="rc-floor-title">{{ f.name }}</div>
      {% for r in f.rooms %}
        <div class="room-card rc-room">
          <div class="rc-room-title">{{ r.name }}</div>
          <div class="rc-rows">
            {% for c in r.circuits %}
              {% include "circuit_list/_circuit_row.html" %}
            {% endfor %}
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="muted">Noch keine Abgänge — oben Räume und Punkte hinzufügen</p>
  {% endfor %}
</div>
