# Front proxy: authenticates every request against Authelia before
# forwarding to KNXpilot. This is what your Synology's reverse proxy
# should point the knxpilot domain at - see ../DEPLOYMENT.md.
#
# EDIT before first start: replace auth.example.com with your real
# Authelia portal subdomain.

events {}

http {
    server {
        listen 80;
        server_name _;

        location /authelia {
            internal;
            proxy_pass_request_body off;
            proxy_pass http://authelia:9091/api/verify;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
            proxy_set_header X-Forwarded-Method $request_method;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
        }

        location / {
            auth_request /authelia;
            auth_request_set $target_url $scheme://$http_host$request_uri;
            auth_request_set $user $upstream_http_remote_user;
            auth_request_set $groups $upstream_http_remote_groups;
            auth_request_set $name $upstream_http_remote_name;
            auth_request_set $email $upstream_http_remote_email;
            proxy_set_header Remote-User $user;
            proxy_set_header Remote-Groups $groups;
            proxy_set_header Remote-Name $name;
            proxy_set_header Remote-Email $email;

            error_page 401 =302 https://auth.example.com/?rd=$target_url;

            proxy_pass http://knxpilot:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # KNXpilot's Update tab does a `git pull` that can take a moment;
            # generous timeouts avoid a false-looking proxy error mid-update.
            proxy_read_timeout 120s;
        }
    }
}
